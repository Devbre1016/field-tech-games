    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.187.0/es2022/three.mjs",
          "react": "https://esm.sh/react@19.3.0/es2022/react.mjs",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/es2022/client.mjs",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/es2022/jsx-runtime.mjs"
        }
      }
    </script>
    <link rel="stylesheet" href="assets/index-IS3NLhfY.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const n = 11;
      const parts = [];
      for (let i = 0; i < n; i++) {
        const res = await fetch("assets/b" + i + ".b64");
        if (!res.ok) throw new Error("part " + i);
        parts.push(await res.text());
      }
      const bin = atob(parts.join("").replace(/\s/g, ""));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], { type: "text/javascript" });
      await import(URL.createObjectURL(blob));
    </script>
  </body>
